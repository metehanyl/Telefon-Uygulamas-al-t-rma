name: Build APK

on:
  push:
    branches:
      - claude/android-prayer-times-app-284zy1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ezan-vakti-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Create release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Ezan Vakti APK (build ${{ github.run_number }})" \
            --notes "Otomatik olarak GitHub Actions ile oluşturulan debug APK. Telefonunda 'bilinmeyen kaynaklardan kurulum' iznini açıp bu dosyayı indirip kurabilirsin."
